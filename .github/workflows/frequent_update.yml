name: Frequent Update

on:
  schedule:
    # Запуск каждые 2 часа (00:00, 02:00 и т.д.)
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Убрали maxminddb, добавили PyGithub для работы с репозиторием
          pip install --no-cache-dir requests PyGithub

      # --- УСТАНОВКА XRAY (Критически важно для нового main.py) ---
      - name: Install Xray Core
        run: |
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip
          # Перемещаем бинарник в папку source, чтобы main.py его нашел
          mv xray source/xray
          chmod +x source/xray

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          # Теперь скрипт запустится, найдет xray рядом с собой и проверит конфиги
          cd source && python main.py
