name: Frequent Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests PyGithub urllib3 maxminddb pysocks

      - name: Get latest Xray version
        id: xray_version
        run: |
          for i in 1 2 3; do
            VERSION=$(curl -sf --max-time 10 "https://api.github.com/repos/XTLS/Xray-core/releases/latest" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" 2>/dev/null)
            if [ -n "$VERSION" ]; then
              break
            fi
            echo "⚠️ Попытка $i не удалась, повтор..."
            sleep 3
          done
          if [ -z "$VERSION" ]; then
            VERSION="v25.3.6"
            echo "⚠️ Используем fallback: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Xray версия: $VERSION"

      - name: Restore Xray cache
        id: xray_cache
        uses: actions/cache@v4
        with:
          path: /tmp/xray
          key: xray-${{ steps.xray_version.outputs.version }}

      - name: Install Xray-core
        if: steps.xray_cache.outputs.cache-hit != 'true'
        run: |
          VERSION=${{ steps.xray_version.outputs.version }}
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${VERSION}/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          echo "✅ Xray ${VERSION} скачан и установлен"

      - name: Verify Xray
        run: |
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH
          echo "✅ Xray: $(/tmp/xray/xray version | head -1)"

      - name: Restore Tools Cache
        uses: actions/cache@v4
        with:
          path: |
            source/GeoLite2-Country.mmdb
            source/cloudflare_ips.txt
          key: tools-v2

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          XRAY_BINARY: /tmp/xray/xray
        run: |
          cd source
          python main.py
