name: Frequent Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # ДЖОБ 1: Находим рабочий RU конфиг (SNI-RU, не HOST)
  # и поднимаем его как прокси для второй джобы
  # ─────────────────────────────────────────────
  find-ru-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      proxy-found: ${{ steps.check.outputs.found }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PyGithub maxminddb pysocks

      - name: Install Xray-core
        run: |
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH
          echo "✅ Xray установлен: $(/tmp/xray/xray version | head -1)"

      - name: Find working RU proxy config
        working-directory: source
        run: python find_ru_proxy.py

      - name: Check result
        id: check
        working-directory: source
        run: |
          FOUND=$(cat proxy_found.txt 2>/dev/null || echo "false")
          echo "found=${FOUND}" >> $GITHUB_OUTPUT
          echo "Прокси найден: ${FOUND}"

      - name: Upload proxy config as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ru-proxy
          path: |
            source/proxy_configs.json
            source/extract_proxy.py
          retention-days: 1

  # ─────────────────────────────────────────────
  # ДЖОБ 2: Основной поиск конфигов через RU прокси
  # ─────────────────────────────────────────────
  main-search:
    needs: find-ru-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PyGithub maxminddb pysocks

      - name: Install Xray-core
        run: |
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH

      - name: Restore Tools Cache
        uses: actions/cache@v3
        with:
          path: |
            source/GeoLite2-Country.mmdb
            source/cloudflare_ips.txt
          key: tools-v2

      - name: Download proxy config artifact
        if: needs.find-ru-proxy.outputs.proxy-found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ru-proxy
          path: source/

      - name: Start RU proxy (if found)
        if: needs.find-ru-proxy.outputs.proxy-found == 'true'
        id: start-proxy
        working-directory: source
        run: |
          echo "🚀 Запускаем все RU прокси параллельно..."
          CONFIGS_COUNT=$(python3 extract_proxy.py count)
          echo "Доступно конфигов: ${CONFIGS_COUNT}"

          # Запускаем все конфиги параллельно на разных портах
          for i in $(seq 0 $((CONFIGS_COUNT - 1))); do
            PORT=$((10808 + i))
            python3 extract_proxy.py get $i $PORT
            xray run -config proxy_current_${i}.json > /tmp/xray_${i}.log 2>&1 &
            echo $! > /tmp/xray_${i}.pid
            echo "  Запущен конфиг $((i+1)) на порту ${PORT}"
          done

          # Ждём пока хоть один поднимется
          sleep 3

          # Проверяем все порты, берём первый рабочий
          for s in $(seq 1 15); do
            for i in $(seq 0 $((CONFIGS_COUNT - 1))); do
              PORT=$((10808 + i))
              if curl -s --max-time 2 --proxy socks5h://127.0.0.1:${PORT} http://cp.cloudflare.com/ > /dev/null 2>&1; then
                echo "✅ Конфиг $((i+1)) работает на порту ${PORT} (${s}с)"
                echo "proxy_active=true" >> $GITHUB_OUTPUT
                echo "proxy_port=${PORT}" >> $GITHUB_OUTPUT
                # Останавливаем остальные
                for j in $(seq 0 $((CONFIGS_COUNT - 1))); do
                  if [ "$j" != "$i" ] && [ -f /tmp/xray_${j}.pid ]; then
                    kill $(cat /tmp/xray_${j}.pid) 2>/dev/null || true
                  fi
                done
                exit 0
              fi
            done
            sleep 1
          done

          echo "⚠️ Ни один прокси не заработал"
          for i in $(seq 0 $((CONFIGS_COUNT - 1))); do
            [ -f /tmp/xray_${i}.pid ] && kill $(cat /tmp/xray_${i}.pid) 2>/dev/null || true
          done
          echo "proxy_active=false" >> $GITHUB_OUTPUT

      - name: Run main script
        working-directory: source
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          RU_PROXY_URL: ${{ steps.start-proxy.outputs.proxy_active == 'true' && format('socks5h://127.0.0.1:{0}', steps.start-proxy.outputs.proxy_port) || '' }}
        run: |
          python main.py

      - name: Stop RU proxy
        if: always()
        run: |
          for i in 0 1 2 3 4; do
            [ -f /tmp/xray_${i}.pid ] && kill $(cat /tmp/xray_${i}.pid) 2>/dev/null || true
          done
          echo "🛑 Прокси остановлены"
          
