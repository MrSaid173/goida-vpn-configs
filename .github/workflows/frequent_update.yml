name: Frequent Update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests PyGithub maxminddb

      # --- ДОБАВЛЕННЫЙ БЛОК КЕША ---
      - name: Restore GeoIP Cache
        id: cache-geoip
        uses: actions/cache@v3
        with:
          # Указываем путь к файлу внутри папки source
          path: source/GeoLite2-Country.mmdb
          # Ключ кеша (если поменяешь ключ, кеш сбросится)
          key: geoip-db-v1

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          cd source && python main.py
