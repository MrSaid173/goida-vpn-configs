name: Frequent Update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests PyGithub maxminddb pysocks

      - name: Restore Tools Cache
        uses: actions/cache@v3
        with:
          path: |
            source/GeoLite2-Country.mmdb
            source/xray
          key: tools-v1

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          cd source
          [ -f xray ] && chmod +x xray 
          python main.py
