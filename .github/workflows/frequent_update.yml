name: Frequent Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # ДЖОБ 1: Находим рабочий RU конфиг (SNI-RU, не HOST)
  # и поднимаем его как прокси для второй джобы
  # ─────────────────────────────────────────────
  find-ru-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      proxy-found: ${{ steps.check.outputs.found }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PyGithub maxminddb pysocks

      - name: Install Xray-core
        run: |
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH
          echo "✅ Xray установлен: $(/tmp/xray/xray version | head -1)"

      - name: Find working RU proxy config
        working-directory: source
        run: python find_ru_proxy.py

      - name: Check result
        id: check
        working-directory: source
        run: |
          FOUND=$(cat proxy_found.txt 2>/dev/null || echo "false")
          echo "found=${FOUND}" >> $GITHUB_OUTPUT
          echo "Прокси найден: ${FOUND}"

      - name: Upload proxy config as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ru-proxy
          path: |
            source/proxy_config.json
            source/proxy_link.txt
          retention-days: 1

  # ─────────────────────────────────────────────
  # ДЖОБ 2: Основной поиск конфигов через RU прокси
  # ─────────────────────────────────────────────
  main-search:
    needs: find-ru-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PyGithub maxminddb pysocks

      - name: Install Xray-core
        run: |
          wget -q "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH

      - name: Restore Tools Cache
        uses: actions/cache@v3
        with:
          path: |
            source/GeoLite2-Country.mmdb
            source/cloudflare_ips.txt
          key: tools-v2

      - name: Download proxy config artifact
        if: needs.find-ru-proxy.outputs.proxy-found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ru-proxy
          path: source/

      - name: Start RU proxy (if found)
        if: needs.find-ru-proxy.outputs.proxy-found == 'true'
        id: start-proxy
        working-directory: source
        run: |
          echo "🚀 Запускаем RU прокси..."
          xray run -config proxy_config.json &
          echo $! > /tmp/xray_proxy.pid
          
          # Ждём до 15 секунд пока прокси поднимется
          for i in $(seq 1 15); do
            sleep 1
            if curl -s --max-time 3 --proxy socks5h://127.0.0.1:10808 http://cp.cloudflare.com/ > /dev/null 2>&1; then
              echo "✅ RU прокси работает (попытка ${i})"
              echo "proxy_active=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "  ожидание... ${i}с"
          done
          
          echo "⚠️ RU прокси не ответил за 15с, продолжаем без него"
          kill $(cat /tmp/xray_proxy.pid) 2>/dev/null || true
          echo "proxy_active=false" >> $GITHUB_OUTPUT

      - name: Run main script
        working-directory: source
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
          RU_PROXY_URL: ${{ steps.start-proxy.outputs.proxy_active == 'true' && 'socks5h://127.0.0.1:10808' || '' }}
        run: |
          python main.py

      - name: Stop RU proxy
        if: always()
        run: |
          if [ -f /tmp/xray_proxy.pid ]; then
            kill $(cat /tmp/xray_proxy.pid) 2>/dev/null || true
            echo "🛑 RU прокси остановлен"
          fi
