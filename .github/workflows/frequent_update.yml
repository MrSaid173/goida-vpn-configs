name: Frequent Update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновил до v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Обновил до v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Добавлен pysocks для работы requests через SOCKS5 прокси
          pip install --no-cache-dir requests PyGithub maxminddb pysocks

      - name: Restore GeoIP Cache
        id: cache-geoip
        uses: actions/cache@v3
        with:
          path: source/GeoLite2-Country.mmdb
          key: geoip-db-v1

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          cd source
          # Запускаем логику
          python main.py
