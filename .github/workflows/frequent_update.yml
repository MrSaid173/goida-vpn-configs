name: Frequent Update
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests PyGithub maxminddb pysocks

      - name: Install Xray-core
        run: |
          XRAY_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -O /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          echo "/tmp/xray" >> $GITHUB_PATH
          echo "✅ Xray ${XRAY_VERSION} установлен: $(/tmp/xray/xray version | head -1)"

      - name: Restore Tools Cache
        uses: actions/cache@v3
        with:
          path: |
            source/GeoLite2-Country.mmdb
            source/cloudflare_ips.txt
          key: tools-v2

      - name: Run script
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          cd source
          python main.py
