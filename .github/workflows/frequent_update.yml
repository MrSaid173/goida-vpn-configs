name: Frequent Update

on:
  schedule:
    # Запуск каждые 2 часа
    - cron: "0 */2 * * *"
  # Позволяет запустить скрипт вручную кнопкой в GitHub
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    # Даем права на запись, чтобы скрипт мог сам обновить xray в репо
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests PyGithub

      - name: Run logic
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        run: |
          # Переходим в папку со скриптом и запускаем
          cd source && python main.py
